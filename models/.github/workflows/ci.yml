name: Iris ML API - CI Pipeline - CSE

# Define when github should run this workflow
on:
# Run CI whenever code is pushed to main branch
  push:
    branches:
      -main

  pull_request:
    branches:
      -main

# permissionns are restricted to read repo content 
permisiions:
  content: read

# Define jobs that make up the pipeline
jobs:
  test-and-build:
    # GitHub repo provide a fresh Ubuntu virtual environment for this job
    runs-on: ubuntu-latest

    steps:
      # step-1: Download the repo content to the runner
      -name: Check out repository
      uses: actions/checkout@v4

      # step-2 : Install python on the runner
      -name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

      # step-3: Install python dependencies
      -name: Install Python dependencies
      run: |
      python -m pip install --upgrade pip
      pip install -r reqiurements.txt

      # step-4: Execute the automated tests
      -name: Run automated tests
      run: python -m pytest -v

      # step-5: Build Docker Image
      -name: Build Docker Image
      run: docker build -t iris-ml-api:${{github.sha}} .
